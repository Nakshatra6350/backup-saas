spring.application.name=backup-saas
spring.sql.init.mode=never
#spring.datasource.url=jdbc:mysql://localhost:3306/backup_saas_master?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.flyway.enabled=false
spring.flyway.url=jdbc:mysql://localhost:3306/backup_saas_master
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG


server.servlet.context-path=/api/v1
server.port=8080
