spring.application.name=backup-saas

# ======================
# Database & JPA
# ======================
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep SQL logging OFF by default for production security/performance
# You can override this locally by setting SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway is disabled here because you have custom config classes managing it
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true


# Keep Flyway logs quiet in production unless debugging is needed
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================
# Server
# ======================
server.servlet.context-path=/api/v1
server.port=8080


# ======================
# Master Datasource
# ======================
master.datasource.url=${MASTER_DATASOURCE_URL}
master.datasource.username=${MASTER_DATASOURCE_USERNAME}
master.datasource.password=${MASTER_DATASOURCE_PASSWORD}
master.datasource.driver-class-name=${MASTER_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ======================
# Security & Integrations
# ======================
jwt.secret=${JWT_SECRET}
crypto.key=${CRYPTO_KEY}

aws.accessKey=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
